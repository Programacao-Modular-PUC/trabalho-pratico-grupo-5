# Default server port
server.port=8080

## MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospedagem}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_USER_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

spring.profiles.active=@activatedProperties@

logging.level.web=${LOG_LEVEL:INFO}
management.endpoints.web.exposure.include=health,info
server.error.whitelabel.enabled=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
