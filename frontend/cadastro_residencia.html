<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Residência</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Cadastro de Residência</h2>

    <form>
      <label>Endereço:</label>
      <input type="text" placeholder="Digite o endereço">

      <label>Número:</label>
      <input type="text" placeholder="Digite o número">

      <label>Bairro:</label>
      <input type="text" placeholder="Digite o bairro">

      <label>CEP:</label>
      <input type="text" placeholder="Digite o CEP">

      <label>Telefone:</label>
      <input type="text" placeholder="Digite o telefone">

      <label>Email:</label>
      <input type="email" placeholder="Digite o email">

      <button type="submit">Cadastrar</button>
    </form>
  </div>

</body>
</html>
