<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - Sistema de Hospedagem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Sistema de Hospedagem</h2>

    <form>
      <label>Email:</label>
      <input type="text" placeholder="Digite seu email">

      <label>Senha:</label>
      <input type="password" placeholder="Digite sua senha">

      <button type="submit">Entrar</button>
    </form>
  </div>

</body>
</html>
