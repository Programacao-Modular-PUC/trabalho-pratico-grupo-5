<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Quarto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Cadastro de Quarto</h2>

    <form>
      <label>Tipo de Quarto:</label>
      <select>
        <option>Solteiro</option>
        <option>Casal</option>
      </select>

      <label>Valor Base da Diária:</label>
      <input type="number" placeholder="Digite o valor">

      <label>
        <input type="checkbox"> Possui Ar Condicionado
      </label>

      <label>
        <input type="checkbox"> Possui Hidromassagem
      </label>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

</body>
</html>
