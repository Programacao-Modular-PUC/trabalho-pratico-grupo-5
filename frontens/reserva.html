<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Reserva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Realizar Reserva</h2>

    <form>
      <label>Cliente:</label>
      <input type="text" placeholder="Nome do cliente">

      <label>Quarto:</label>
      <input type="text" placeholder="Tipo ou número do quarto">

      <label>Data de Entrada:</label>
      <input type="date">

      <label>Data de Saída:</label>
      <input type="date">

      <button type="submit">Reservar</button>
    </form>
  </div>

</body>
</html>
